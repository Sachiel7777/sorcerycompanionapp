name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Sign with the project's own release key when the secrets are set
      # (pull requests from forks don't get secrets and use the debug key).
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APK is signed with a throwaway debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=release
          keyPassword=$KEYSTORE_PASSWORD
          EOF
      - run: flutter build apk --release
      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk sorcery-companion.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sorcery-companion-apk
          path: sorcery-companion.apk

  # Publishes the APK as a GitHub Release asset on every push to main.
  # Kept as a separate job so that only it gets write access to the repo.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sorcery-companion-apk
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tag = pubspec version + CI run number, e.g. v1.0.0-build.42
          version=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)
          tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" sorcery-companion.apk \
            --target "$GITHUB_SHA" \
            --title "Sorcery Companion ${version} (build ${GITHUB_RUN_NUMBER})" \
            --generate-notes --latest
